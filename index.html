<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
</head>

<body>
    <h1>BMI Calculator</h1>

    <form method="POST">
        <label for="weight">Weight (kg):</label>
        <input type="number" id="weight" name="weight" step="any" min="0.01" required>

        <br><br>

        <label for="height">Height (meters):</label>
        <input type="number" id="height" name="height" step="any" min="0.01" required>

        <br><br>

        <button type="submit">Calculate BMI</button>
    </form>

    {% if bmi is not none %}
    <h2>Your BMI: {{ bmi }}</h2>
    <p>Category: {{ category }}</p>
    {% endif %}
</body>

</html>
